name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]   # daily
  workflow_dispatch:                   # manual trigger
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kuawrhime
          filename: github-metrics.svg
